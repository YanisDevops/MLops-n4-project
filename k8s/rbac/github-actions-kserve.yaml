apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-kserve-deployer
  namespace: ml-serving
rules:
  - apiGroups:
      - serving.kserve.io
    resources:
      - inferenceservices
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-kserve-deployer
  namespace: ml-serving
subjects:
  - kind: Group
    name: mlops-n4-github-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: github-actions-kserve-deployer
  apiGroup: rbac.authorization.k8s.io
