apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops-platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: mlflow}
  template:
    metadata:
      labels: {app: mlflow}
    spec:
      serviceAccountName: mlflow
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.16.2
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              pip install --no-cache-dir psycopg2-binary boto3 &&
              mlflow server
              --host 0.0.0.0
              --port 5000
              --backend-store-uri "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
              --serve-artifacts
              --artifacts-destination "${MLFLOW_ARTIFACT_DESTINATION}"
              --serve-artifacts
          envFrom:
            - configMapRef: {name: mlflow-config}
            - secretRef: {name: postgres-secret}
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
